name: coda

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # 5432 avoided — commonly bound by a local Postgres install
    volumes:
      # Bind-mounted to a native-filesystem path, not the postgres-data named
      # volume: Postgres refuses to start on a volume whose backing
      # filesystem can't report real Unix ownership (e.g. NTFS via fuseblk),
      # which is what you get if $POSTGRES_DATA_DIR / Docker's data-root sits
      # on such a mount. Override POSTGRES_DATA_DIR in .env if $HOME isn't
      # on a native filesystem either.
      - type: bind
        source: ${POSTGRES_DATA_DIR:-${HOME}/.local/share/coda-dev/postgres-data}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # AOF on: ADR-0002 makes Redis persistence a correctness concern rather
    # than a cache setting, because stage.* streams carry in-flight pipeline
    # work. A restart that lost the PEL would lose every unacknowledged
    # message — recoverable from Postgres by the orchestrator's dispatch
    # scan, but only after a stage timeout, and at the cost of re-running
    # work that was already in progress.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9010:9000" # 9000/9001 avoided — commonly bound by another local MinIO
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  go-api:
    build:
      context: ./go
      args:
        SERVICE: api
    environment:
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      HTTP_PORT: ${GO_API_HTTP_PORT}
      METRICS_PORT: ${GO_API_METRICS_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_ASYNQ_DB: ${REDIS_ASYNQ_DB:-1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  go-orchestrator:
    build:
      context: ./go
      args:
        SERVICE: orchestrator
    environment:
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      HEALTH_PORT: ${GO_ORCHESTRATOR_HEALTH_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_ASYNQ_DB: ${REDIS_ASYNQ_DB:-1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "8081:8081" # dev convenience — no public API in production (architecture.md §1.1)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  asr-service:
    build:
      context: ./python
      dockerfile: Dockerfile
      args:
        SERVICE: asr-service
    command: ["python", "-m", "asr_service.server"]
    environment:
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      GRPC_PORT: ${ASR_GRPC_PORT}
      HEALTH_PORT: ${ASR_HEALTH_PORT}
      GROQ_API_KEY: ${GROQ_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MODEL_CACHE_DIR: /model-cache
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-medium}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-en}
      ASR_DIARIZATION_MODEL: ${ASR_DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      ASR_ROLE_MODEL: ${ASR_ROLE_MODEL:-llama-3.1-8b-instant}
      ASR_ROLE_CONFIDENCE_THRESHOLD: ${ASR_ROLE_CONFIDENCE_THRESHOLD:-0.6}
      ASR_CHUNK_LENGTH_S: ${ASR_CHUNK_LENGTH_S:-300}
      ASR_CHUNK_OVERLAP_S: ${ASR_CHUNK_OVERLAP_S:-5}
      ASR_TARGET_LOUDNESS_DBFS: ${ASR_TARGET_LOUDNESS_DBFS:--20}
    volumes:
      - model-cache:/model-cache
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # /readyz (not /healthz): asr-service loads faster-whisper + pyannote
      # once at startup (asr_service/models.py) before it starts consuming
      # stage.asr, so "healthy" here means "models loaded and warmed up",
      # not just "process is up" — the distinction matters for e2e's
      # depends_on: condition: service_healthy.
      test: ["CMD", "curl", "-f", "http://localhost:${ASR_HEALTH_PORT}/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Generous: a cold model-cache volume means downloading faster-whisper
      # medium (~1.5GB) and pyannote 3.1's checkpoints on first run.
      start_period: 300s

  nlp-service:
    build:
      context: ./python
      dockerfile: Dockerfile
      args:
        SERVICE: nlp-service
    command: ["python", "-m", "nlp_service.server"]
    environment:
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      GRPC_PORT: ${NLP_GRPC_PORT}
      HEALTH_PORT: ${NLP_HEALTH_PORT}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NLP_HEALTH_PORT}/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${GO_API_HTTP_PORT}
    ports:
      - "5173:5173"
    depends_on:
      go-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # e2e: runs scripts/e2e_smoke.py inside the compose network so it resolves
  # go-api/minio by their container hostnames — the same reason presigned
  # MinIO URLs (signed against MINIO_ENDPOINT="minio:9000") can't be driven
  # from the host: SigV4 signs the Host header, so no client-side rewrite
  # after signing can work. `profiles: [tools]` keeps this out of a plain
  # `docker compose up`; invoked via `make e2e` (docker compose run --rm e2e).
  e2e:
    image: python:3.11-slim
    profiles: ["tools"]
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts:ro
    environment:
      E2E_API_BASE: http://go-api:${GO_API_HTTP_PORT}/v1
      E2E_MINIO_REWRITE_TO: ""
    entrypoint: ["python3", "e2e_smoke.py"]
    depends_on:
      go-api:
        condition: service_healthy
      asr-service:
        condition: service_healthy
      nlp-service:
        condition: service_healthy

volumes:
  redis-data:
  minio-data:
  model-cache:
