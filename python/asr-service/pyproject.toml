[project]
name = "asr-service"
version = "0.0.1"
description = "Groq whisper-large-v3-turbo transcription + pyannote.audio diarization + transcript assembly. Owns audio only; knows nothing about clinical fields or the thought graph (architecture.md §1.2)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "coda-proto",
    "coda-worker-sdk",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "types-grpcio>=1.0,<2",
]

[tool.uv.sources]
coda-proto = { workspace = true }
coda-worker-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_service"]
