[project]
name = "coda-proto"
version = "0.0.1"
description = "Generated Python classes for the coda.v1 protobuf contracts (proto/coda/v1). Do not hand-edit generated files."
requires-python = ">=3.11,<3.12"
dependencies = [
    "protobuf>=5.28,<6",
    "grpcio>=1.68,<2",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coda"]
