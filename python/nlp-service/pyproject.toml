[project]
name = "nlp-service"
version = "0.0.1"
description = "PII redaction, thought construction, thought-graph assembly, MeSH/ICD-10 linking, GoT-lite reasoning, hierarchical distillation. Owns no audio and no workflow state (architecture.md §1.2)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "coda-proto",
    "coda-worker-sdk",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "psycopg[binary]>=3.2,<4",
    # Module 5's consistency scorer (claude_context.md §4 pins
    # all-MiniLM-L6-v2). Optional at runtime by design:
    # nlp_service.reasoning.embeddings falls back to a deterministic lexical
    # backend when the package or the model weights are unavailable, and
    # records which one ran on every score (decision #97).
    "sentence-transformers>=3.0,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "types-grpcio>=1.0,<2",
    "types-jsonschema>=4.23,<5",
]

[tool.uv.sources]
coda-proto = { workspace = true }
coda-worker-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `tests/` on the path so the graph tests can `from fixtures import
# transcripts`. Without it pytest only inserts each test file's own
# directory, and `tests/graph/*` cannot see `tests/fixtures/`.
pythonpath = ["tests"]
