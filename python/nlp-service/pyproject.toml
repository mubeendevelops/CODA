[project]
name = "nlp-service"
version = "0.0.1"
description = "PII redaction, thought construction, thought-graph assembly, MeSH/ICD-10 linking, GoT-lite reasoning, hierarchical distillation. Owns no audio and no workflow state (architecture.md §1.2)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "coda-proto",
    "coda-worker-sdk",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "types-grpcio>=1.0,<2",
    "types-jsonschema>=4.23,<5",
]

[tool.uv.sources]
coda-proto = { workspace = true }
coda-worker-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
